# VPN Topology: global settings, canvas groups and observation sources.
# Nodes, links, routes and alerts live in topology/components/*.yaml.
# Schema: schema/map.schema.json (generated by `vpnmap schema`).
schema: vpnmap/v1
name: VPN Infrastructure
docs: https://app.notion.com/p/3f828d2a9e9b8115bba4ee2a8a69c8fc

settings:
  timezone: Asia/Tehran
  stale_after: 30s        # no data for longer than this = grey ("no data")
  reboot_window: 30m      # reboot badge for this long after a boot
  hub: https://map.imdev.ir   # domain to confirm

groups:
  - { id: iran-dc, title: Iran DC · same LAN, kind: datacenter, notes: "Panel, Relay 1 and XBridger node 3 share one LAN (0.2 ms)." }
  - { id: iran-other, title: Iran · other provider, kind: datacenter }
  - { id: abroad, title: Abroad · hostvds FR, kind: datacenter }
  - { id: coolify, title: Coolify server, kind: datacenter, notes: "Location UNVERIFIED." }
  - { id: mullvad, title: Mullvad relays, kind: provider }
  - { id: home, title: Home · personal, kind: personal }
  - { id: external, title: External, kind: external }

sources:
  - id: probe
    title: E2E probe (Iran, outside the user path)
    location: TO DECIDE
    notes: >-
      Runs sing-box with a dedicated monitoring user and tcp-connect checks.
      Must be a server inside Iran that no user traffic passes through.

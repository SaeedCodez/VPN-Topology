# yaml-language-server: $schema=../../schema/topology.schema.json
component: fleet
title: Fleet-wide rules (all servers and links)
docs: https://app.notion.com/p/3f828d2a9e9b814da13efd6632b6eb8f   # 08 · Known Issues
description: Alert rules that apply to every server or link, rather than to one feature.

alerts:
  - id: server-rebooted
    when: "node.*.rebooted == true"
    severity: warning
    title: Server rebooted
    message_fa: "سرور {name} ری‌بوت شد."
    message_en: "Server {name} rebooted."

  - id: traffic-drop
    when: "link.*.traffic_drop > 80% for 10m"
    severity: warning
    title: Traffic dropped
    message_fa: "ترافیک {name} نسبت به همین ساعت دیروز بیش از ۸۰٪ کاهش یافته است."
    message_en: "Traffic on {name} is more than 80% below the same hour yesterday."

  - id: wg-handshake-old
    when: "collector.wg-handshake.status != ok"
    severity: warning
    title: WireGuard handshake old
    message_fa: "آخرین هندشیک وایرگارد {name} قدیمی‌تر از ۳ دقیقه است."
    message_en: "The latest WireGuard handshake on {name} is older than 3 minutes."

  - id: disk-high
    when: "node.*.disk > 85%"
    severity: warning
    title: Disk almost full
    message_fa: "دیسک سرور {name} بیش از ۸۵٪ پر است."
    message_en: "Disk on {name} is more than 85% full."

# yaml-language-server: $schema=../../schema/topology.schema.json
component: mullvad-route
title: Mullvad route (Mullvad-Test squad → DE / US / TR / FR)
docs: https://app.notion.com/p/3f828d2a9e9b819d90d8e9173fac68bc   # 01 · Flow B
description: >-
  Users connect directly to the Iran-Mullvad node (no relay). Each inbound
  (443 = DE, 8443 = US, 2053 = TR, 2083 = FR) goes to its own SOCKS outbound, into a
  network namespace with a WireGuard tunnel to a Mullvad relay. TCP only
  (08 #20). The US tunnel was dead on 2026-10-21 (08 #21).

nodes:
  - id: iran-mullvad
    name: Iran-Mullvad
    kind: vpn-node
    group: iran-other
    address: [92.42.207.243]
    role: "Remnawave node; netns mv-de / mv-us / mv-tr / mv-fr (WireGuard to Mullvad); wg-game udp/51821"
    agent: true
    docs: https://app.notion.com/p/3f828d2a9e9b819baabcc44ca0b4538f
    facts:
      - { label: Software, value: "remnanode 3.4.2, mullvad-ns, microsocks, game-gw" }
      - { label: Inbounds, value: "443 DE · 8443 US · 2053 TR · 2083 FR (profile MULLVAD-IR)" }
      - { label: UDP, value: "not carried on the Xray route (08 #20)" }
    checks:
      - { id: remnawave, collector: remnawave-node, node: Iran-Mullvad }
      - { id: container, collector: docker-container, host: iran-mullvad, container: remnanode, require_healthy: false }
      - { id: ns-de, collector: systemd-unit, host: iran-mullvad, unit: mullvad-ns@de.service, on_fail: degraded }
      - { id: ns-us, collector: systemd-unit, host: iran-mullvad, unit: mullvad-ns@us.service, on_fail: degraded }
      - { id: ns-tr, collector: systemd-unit, host: iran-mullvad, unit: mullvad-ns@tr.service, on_fail: degraded }
      - { id: ns-fr, collector: systemd-unit, host: iran-mullvad, unit: mullvad-ns@fr.service, on_fail: degraded }
    metrics:
      - { id: online, label: Online, collector: remnawave-online, node: Iran-Mullvad }
      - { id: conns, label: Conns, collector: ss-conns, host: iran-mullvad, ports: [443, 8443, 2053, 2083] }
    card: [online, conns, cpu]
    runbook:
      - { title: mullvad-ns status, cmd: "ssh root@92.42.207.243 'mullvad-ns status'" }
      - { title: Handshakes in every namespace, cmd: "ssh root@92.42.207.243 'for n in de us tr fr; do echo mv-$n; ip netns exec mv-$n wg show all latest-handshakes; done'" }

  - id: mullvad-de
    name: Mullvad DE
    kind: vpn-provider
    group: mullvad
    address: [de-dus-wg-103, 80.66.197.209]
    role: Düsseldorf relay, exit of the DE route and the game tunnel
    docs: https://app.notion.com/p/3f828d2a9e9b811497def9a6a1ae0b6d

  - id: mullvad-us
    name: Mullvad US
    kind: vpn-provider
    group: mullvad
    address: [us-nyc-wg-003, 23.162.8.3]
    role: New York relay, exit of the US route
    docs: https://app.notion.com/p/3f828d2a9e9b811497def9a6a1ae0b6d

  - id: mullvad-tr
    name: Mullvad TR
    kind: vpn-provider
    group: mullvad
    address: [tr-ist-wg-001, 149.102.229.129]
    role: Istanbul relay, exit of the TR route
    docs: https://app.notion.com/p/3f828d2a9e9b811497def9a6a1ae0b6d

  - id: mullvad-fr
    name: Mullvad FR
    kind: vpn-provider
    group: mullvad
    address: [fr-par-wg-004, 193.32.126.69]
    role: Paris relay (Mullvad-owned), exit of the FR route
    docs: https://app.notion.com/p/3f828d2a9e9b811497def9a6a1ae0b6d
    facts:
      - { label: RTT from node, value: "98 ms (2026-11-04; DE 88 ms, TR 136 ms)" }

links:
  - id: e7
    label: E7
    title: Users → Iran-Mullvad
    from: users
    to: iran-mullvad
    plane: data
    protocol: "VLESS+REALITY 443 (DE) · 8443 (US) · 2053 (TR) · 2083 (FR)"
    traffic: { collector: nft-counter, host: iran-mullvad, up: { hook: input, proto: tcp, dport: [443, 8443, 2053, 2083] }, down: { hook: output, proto: tcp, sport: [443, 8443, 2053, 2083] } }
    conns: { collector: ss-conns, host: iran-mullvad, ports: [443, 8443, 2053, 2083] }
    health:
      - { id: de-443, collector: tcp-connect, from: probe, target: "92.42.207.243:443", on_fail: degraded }
      - { id: us-8443, collector: tcp-connect, from: probe, target: "92.42.207.243:8443", on_fail: degraded }
      - { id: tr-2053, collector: tcp-connect, from: probe, target: "92.42.207.243:2053", on_fail: degraded }
      - { id: fr-2083, collector: tcp-connect, from: probe, target: "92.42.207.243:2083", on_fail: degraded }

  - id: e8-de
    label: E8a
    title: Iran-Mullvad → Mullvad DE (wg-de)
    from: iran-mullvad
    to: mullvad-de
    plane: data
    protocol: WireGuard udp/51820 (netns mv-de)
    traffic: { collector: wg-transfer, host: iran-mullvad, netns: mv-de, interface: wg-de }
    health: { collector: wg-handshake, host: iran-mullvad, netns: mv-de, interface: wg-de, max_age: 3m }

  - id: e8-us
    label: E8b
    title: Iran-Mullvad → Mullvad US (wg-us)
    from: iran-mullvad
    to: mullvad-us
    plane: data
    protocol: WireGuard udp/51820 (netns mv-us)
    traffic: { collector: wg-transfer, host: iran-mullvad, netns: mv-us, interface: wg-us }
    health: { collector: wg-handshake, host: iran-mullvad, netns: mv-us, interface: wg-us, max_age: 3m }
    notes: "2026-10-21: last handshake ~6 days old (08 #21). Fix: mullvad-ns select us."

  - id: e8-tr
    label: E8c
    title: Iran-Mullvad → Mullvad TR (wg-tr)
    from: iran-mullvad
    to: mullvad-tr
    plane: data
    protocol: WireGuard udp/51820 (netns mv-tr)
    traffic: { collector: wg-transfer, host: iran-mullvad, netns: mv-tr, interface: wg-tr }
    health: { collector: wg-handshake, host: iran-mullvad, netns: mv-tr, interface: wg-tr, max_age: 3m }

  - id: e8-fr
    label: E8d
    title: Iran-Mullvad → Mullvad FR (wg-fr)
    from: iran-mullvad
    to: mullvad-fr
    plane: data
    protocol: WireGuard udp/51820 (netns mv-fr)
    traffic: { collector: wg-transfer, host: iran-mullvad, netns: mv-fr, interface: wg-fr }
    health: { collector: wg-handshake, host: iran-mullvad, netns: mv-fr, interface: wg-fr, max_age: 3m }

  - { id: mv-de-exit, title: Mullvad DE → Internet, from: mullvad-de, to: internet, plane: data, protocol: egress }
  - { id: mv-us-exit, title: Mullvad US → Internet, from: mullvad-us, to: internet, plane: data, protocol: egress }
  - { id: mv-tr-exit, title: Mullvad TR → Internet, from: mullvad-tr, to: internet, plane: data, protocol: egress }
  - { id: mv-fr-exit, title: Mullvad FR → Internet, from: mullvad-fr, to: internet, plane: data, protocol: egress }

routes:
  - id: mullvad-de
    title: Mullvad DE
    hops: [e7, e8-de, mv-de-exit]
    squads: [Mullvad-Test]
    users: { collector: remnawave-online, node: Iran-Mullvad }
    users_estimate: 3
    probe: { collector: e2e-probe, expect_country: DE }

  - id: mullvad-us
    title: Mullvad US
    hops: [e7, e8-us, mv-us-exit]
    squads: [Mullvad-Test]
    users: { collector: remnawave-online, node: Iran-Mullvad }
    users_estimate: 3
    probe: { collector: e2e-probe, expect_country: US }

  - id: mullvad-tr
    title: Mullvad TR
    hops: [e7, e8-tr, mv-tr-exit]
    squads: [Mullvad-Test]
    users: { collector: remnawave-online, node: Iran-Mullvad }
    users_estimate: 3
    probe: { collector: e2e-probe, expect_country: TR }

  - id: mullvad-fr
    title: Mullvad FR
    hops: [e7, e8-fr, mv-fr-exit]
    squads: [Mullvad-Test]
    users: { collector: remnawave-online, node: Iran-Mullvad }
    users_estimate: 3
    probe: { collector: e2e-probe, expect_country: FR }

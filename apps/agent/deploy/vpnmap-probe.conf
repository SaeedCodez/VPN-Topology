# Drop-in for probe mode (agent.yaml has a `probe:` section). install.sh puts
# it at /etc/systemd/system/vpnmap-agent.service.d/probe.conf.
#
# In probe mode the agent starts one `sing-box run` child per route. The child
# listens on 127.0.0.1 only (its `mixed` inbound) and its generated config,
# which contains the monitoring user's credentials, lives in the 0700 runtime
# directory below and is deleted when the agent stops.
[Service]
RuntimeDirectory=vpnmap-probe
RuntimeDirectoryMode=0700
# sing-box may watch interfaces over netlink.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
# Not needed by Go binaries today, but a sing-box build with other runtimes
# (or a future JIT) would crash under it; the probe host is dedicated.
MemoryDenyWriteExecute=no
MemoryMax=256M
CPUQuota=50%
TasksMax=256
